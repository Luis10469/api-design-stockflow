<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockFlow · Panel de inventario</title>
  <meta name="description" content="Panel web de StockFlow API: categorías, proveedores, productos y movimientos de stock.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="/static/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/estilos.css?v=1">
  <script>
    // Tema elegido antes de pintar, para que no parpadee al cargar.
    try { var tema = localStorage.getItem('stockflow-tema'); if (tema) document.documentElement.dataset.theme = tema; } catch (e) {}
  </script>
  <script type="module" src="/static/app.js?v=1"></script>
</head>
<body>
  <div class="cabecera">
    <header class="barra">
      <a class="marca" href="#resumen" aria-label="StockFlow, ir al resumen">
        <span class="marca__logo">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 8-9-5-9 5v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
        </span>
        <span class="marca__texto"><strong>StockFlow</strong><span>Panel de inventario</span></span>
      </a>
      <div class="barra__acciones">
        <span id="estado-api" class="estado" data-estado="cargando" title="Conectando con la API"><span>Conectando…</span></span>
        <a class="boton boton--fantasma boton--chico" href="/docs" target="_blank" rel="noopener">Docs API</a>
        <button id="cambiar-tema" class="boton boton--icono" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <nav class="pestanas" aria-label="Secciones">
      <a href="#resumen" data-vista="resumen">Resumen</a>
      <a href="#productos" data-vista="productos">Productos</a>
      <a href="#movimientos" data-vista="movimientos">Movimientos</a>
      <a href="#categorias" data-vista="categorias">Categorías</a>
      <a href="#proveedores" data-vista="proveedores">Proveedores</a>
    </nav>
  </div>

  <main id="contenido" class="contenido">
    <p class="cargando">Cargando datos de la API…</p>
  </main>

  <footer class="pie">
    StockFlow API · FastAPI + SQLModel · <a href="/docs" target="_blank" rel="noopener">Documentación interactiva</a>
  </footer>

  <dialog id="dialogo" class="dialogo" aria-label="Ventana"></dialog>
  <div id="avisos" class="avisos" aria-live="polite"></div>
</body>
</html>
